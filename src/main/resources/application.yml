# 스프링 부트 서버가 실행될 때 자동으로 로딩되는 설정 파일.
# 데이터베이스 설정 정보, 서버 포트, 로깅 레벨 등 다양한 설정을 정의할 수 있음.
# yml을 쓰는 이유는 가독성이 높고, 중첩된 구조를 쉽게 표현할 수 있음.

spring:
  jpa:
    # 전송 쿼리 확인
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:                 # 데이터베이스 정보 추가
    url:  jdbc:h2:mem:testdb
    username: sa
  h2:                         # H2 콘솔 활성화
    console:
      enabled:  true

    # 테이블 생성 후에 data.sql 실행
    defer-datasource-initialization: true